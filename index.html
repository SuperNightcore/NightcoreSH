<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Link in Bio</title>
    <style>
        :root {
            --hk-pink: #FFB7C5;
            --hk-dark-pink: #FF69B4;
            --text-main: #4A4A4A;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 183, 197, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #FFF0F5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: var(--text-main);
            padding: 20px;
        }

        /* --- Glassmorphism Container --- */
        .bio-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--glass-border);
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.25);
        }

        /* --- Avatar Header --- */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
        }

        .hk-bow-stamp {
            position: absolute;
            top: -8px;
            right: -8px;
            font-size: 36px;
            transform: rotate(15deg);
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--hk-dark-pink);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        /* --- Link Buttons --- */
        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.25s ease;
            border: 2px solid transparent;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            border-color: var(--hk-pink);
            box-shadow: 0 5px 15px rgba(255, 183, 197, 0.4);
            background: #FFF5F7;
            color: var(--hk-dark-pink);
        }

        /* --- Audio Player --- */
        .audio-player {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 18px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--glass-border);
        }

        .play-btn {
            background: var(--hk-pink);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .play-btn:hover {
            background: var(--hk-dark-pink);
        }

        .track-info {
            flex-grow: 1;
            text-align: left;
        }

        .track-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--hk-dark-pink);
        }

        .track-artist {
            font-size: 11px;
            color: #888;
        }

        /* --- Hello Kitty Floating Effect --- */
        #kawaiiEffect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .kawaii-item {
            position: absolute;
            bottom: -50px;
            pointer-events: none;
            user-select: none;
            will-change: transform;
            opacity: 0;
            animation: kawaiiFloatUp linear infinite;
        }

        .kawaii-item.small { font-size: 14px; }
        .kawaii-item.medium { font-size: 24px; }
        .kawaii-item.large { font-size: 34px; }

        @keyframes kawaiiFloatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.85; }
            80% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Main Bio Card -->
    <div class="bio-container">
        
        <div class="avatar-wrapper">
            <img src="avatar.jpg" alt="Profile Avatar" class="avatar">
            <span class="hk-bow-stamp">🎀</span>
        </div>

        <h1>Welcome</h1>
        <p class="subtitle">Welcome to my link in bio! ✨</p>

        <div class="links-wrapper">
            <a href="https://steamcommunity.com/id/aaah_thw" class="link-btn"><span>🎀</span> Steam</a>
            <a href="#" class="https://www.facebook.com/profile.php?id=61594183016717"><span>🌸</span> Social Media</a>
            <a href="#" class="https://www.faceit.com/en/players/-aloligirl"><span>⭐</span> FACEIT</a>
        </div>

        <!-- Audio Player Widget -->
        <div class="audio-player">
            <button class="play-btn" id="playPause">▶</button>
            <div class="track-info">
                <div class="track-title">illit - NOT CUTE ANYMORE (Sped Up ver.)</div>
                <div class="track-artist">music.mp3</div>
            </div>
            <span style="font-size: 18px;">🎶</span>
            <audio id="bgMusic" src="music.mp3" loop></audio>
        </div>
    </div>

    <!-- Hello Kitty Floating Effect Layer & Script -->
    <div id="kawaiiEffect"></div>

    <script>
        // Audio Player Controls
        const music = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playPause');

        playBtn.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                playBtn.textContent = '⏸';
            } else {
                music.pause();
                playBtn.textContent = '▶';
            }
        });

        // Floating Hello Kitty Elements Effect
        (function() {
            const effectContainer = document.getElementById('kawaiiEffect');
            const kawaiiSymbols = ['🎀', '⭐', '✨', '❤️', '🌸', '💝'];

            function createKawaiiItem() {
                if (!effectContainer) return;
                const item = document.createElement('div');
                item.className = 'kawaii-item';
                item.textContent = kawaiiSymbols[Math.floor(Math.random() * kawaiiSymbols.length)];
                
                const sizes = ['small', 'medium', 'large'];
                item.classList.add(sizes[Math.floor(Math.random() * sizes.length)]);
                item.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 6 + 8; // Floats for 8s to 14s
                item.style.animationDuration = duration + 's';

                effectContainer.appendChild(item);
                setTimeout(() => item.remove(), duration * 1000);
            }

            setInterval(createKawaiiItem, 400);
        })();
    </script>
</body>
</html>
